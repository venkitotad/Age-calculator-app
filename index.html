<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Age calculator app</title>
  <link rel="stylesheet" href="style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>

<body>
  <main class="container">
    <form id="age-form" novalidate>
      <div class="inputs">
        <div class="input-group">
          <label for="day">DAY</label>
          <input type="number" id="day" placeholder="DD" min="1" max="31">
          <small class="error"></small>
        </div>

        <div class="input-group">
          <label for="month">MONTH</label>
          <input type="number" id="month" placeholder="MM" min="1" max="12">
          <small class="error"></small>
        </div>

        <div class="input-group">
          <label for="year">YEAR</label>
          <input type="number" id="year" placeholder="YYYY" min="1">
          <small class="error"></small>
        </div>
      </div>

      <div class="divider">
        <button type="submit" aria-label="Calculate age">
          <img src="./assets/images/icon-arrow.svg" alt="">
        </button>
      </div>
    </form>

    <section class="results" aria-live="polite">
      <p><span id="years">--</span> years</p>
      <p><span id="months">--</span> months</p>
      <p><span id="days">--</span> days</p>
    </section>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">venkitotad</a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
